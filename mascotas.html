<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Institucional | Veterinaria El Cachilo</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/mascota.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="shortcut icon" href="./assets/images/logo_icono.ico"/>
    <!-- Antes va sesion.js para que al abrir mascotas tome la funcion
     de 'estaLogueado' -->
    <script defer src="./js/sesion.js"></script>
    <script defer src="./js/header.js"></script>
    <script defer src="./js/footer.js"></script>
    
    <script defer src="./js/mascotas.js"></script>
    
</head>

<body>
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">INFORMACIÓN</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                Función no habilitada. Comuniquese con el administrador del sistema.
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
            </div>
        </div>
    </div>
    
    <header>
        <img src="./assets/images/logo 200px.png" alt="Veterinaria El Cachilo" height="80">

        <nav class="barraNavegacion navbar navbar-expand-lg navbar-light bg-white sticky-top">
         
        </nav>
    </header>

    <main>
        <section class="banner position-relative">
            <img src="./assets/images/Mascotas.webp" class="w-100" alt="Perro y gato en clínica">
            <div class="position-absolute top-50 start-50 translate-middle text-center px-3">
                <div class="banner-text">
                    <h1>Nuestras Mascotas</h1>
                </div>
            </div>
        </section>

        <!-- MASCOTAS         -->
        <section class="container py-5">
            <div class="row g-4">

                <article class="col-12">
                    <h2 class="fs-1 fw-semibold mt-2">
                        Mascotas Registradas 
                        <span class="badge text-bg-secondary align-middle fs-5" id="total_mascotas">
                        0
                        </span>

                        <button class="btn btn-primary text-align-right float-end" onclick="modalAgregar.show()">
                        Agregar mascota
                        </button>
                    </h2>

                    <div class="table-responsive-md">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                <th>Dueño</th>
                                <th>Mascota</th>
                                <th>Color</th>
                                <th>Edad</th>
                                <th>Peso</th>
                                <!-- <th>Imagen</th> -->
                                </tr>
                            </thead>
                            <tbody id="listar_mascotas">
                        
                            </tbody>
                        </table>
                    </div>
                </article>
            </div>
        </section>

        <!-- MODAL para agregar -->
        <div class="modal fade" id="modal-agregar" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Nueva Mascota</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    
                    <form class="d-flex flex-column gap-3 p-4 bg-body-tertiary rounded-4" id="form-agregar-mascota">
                        <!-- <h3 class="fs-4">Nueva Mascota</h3> -->

                        <div>
                            <label for="nombreDuenio" class="form-label">Dueño</label>
                            <input type="text" name="nombreDuenio" id="nombreDuenio" class="form-control" required>
                        </div>

                        <div>
                            <label for="nombreMascota" class="form-label">Nombre de la Mascota</label>
                            <input type="text" name="nombreMascota" id="nombreMascota" class="form-control" required>
                        </div>

                        <div>
                            <label for="color" class="form-label">Color</label>
                            <input type="text" name="color" id="color" class="form-control" required>
                        </div>

                        <div>
                            <label class="form-label" for="edad">Edad</label>
                            <input class="form-control" type="number" name="edad" id="edad" min="0" max="30" required>
                        </div>

                        <div>
                            <label class="form-label" for="peso">Peso en kg</label>
                            <input class="form-control" type="number" name="peso" id="peso" min="0" step="0.01" required>
                        </div>

                        <!--  IMAGEN POSIBLE 
                        <div>
                            <label class="form-label" for="imagenMascota">Imagen de la Mascota</label>
                            <input class="form-control" type="file" name="imagenMascota" id="imagenMascota" accept=".png,.jpg,.jpeg"  required>
                        </div> -->

                        <button id="botonAgregarMascota" class="btn btn-primary" type="submit">Agregar Mascota</button>
                    </form>
                </div>
            </div>
        </div>

        <!-- MODAL para editar -->
        <div class="modal fade" id="modal-editar" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Editar Mascota</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <form id="form-editar">
                        <div class="modal-body d-flex flex-column gap-3">
                            <div> 
                                <label for="editarNombreDuenio" class="form-label">Dueño</label>
                                <input type="text" name="editarNombreDuenio" id="editarNombreDuenio" class="form-control" required>
                            </div>
                            <div>
                                <label for="editarNombreMascota" class="form-label">Nombre de la Mascota</label>
                                <input type="text" name="editarNombreMascota" id="editarNombreMascota" class="form-control" required>
                            </div>
                        
                            <div>
                                <label for="editarColor" class="form-label">Color</label>
                                <input type="text" name="editarColor" id="editarColor" class="form-control" required>
                            </div>

                            <div>
                                <label for="editarEdad" class="form-label">Edad</label>
                                <input type="number" name="editarEdad" id="editarEdad" class="form-control" min="0" max="30" required>
                            </div>

                            <div>
                                <label for="editarPeso" class="form-label">Peso en kg</label>
                                <input type="number" name="editarPeso" id="editarPeso" class="form-control" min="0" step="0.01" required>
                            </div>
                        </div>

                            <div class="modal-footer">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button type="submit" class="btn btn-primary">Guardar cambios</button>
                            </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="contenedor_footer">
    </footer>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
