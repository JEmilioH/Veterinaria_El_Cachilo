<!DOCTYPE html>
<html lang="es-AR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gestión de Turnos | Veterinaria El Cachilo</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="shortcut icon" href="./assets/images/logo_icono.ico"/>

    <script defer src="./js/sesion.js"></script>
    <script defer src="./js/header.js"></script>
    <script defer src="./js/footer.js"></script>
    <script defer src="./js/turnos.js"></script>
</head>

<body>
    <header>
        <img src="./assets/images/logo 200px.png" alt="Veterinaria El Cachilo" height="80">
        <nav id="nav-item-turnos" class="barraNavegacion navbar navbar-expand-lg navbar-light bg-white sticky-top">
        </nav>
    </header>

    <main class="container py-5">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <h1 class="display-6 fw-bold mb-1">Gestión de Turnos</h1>
                <p class="text-muted mb-0">Registro, listado y eliminación de turnos médicos</p>
            </div>
            <button type="button" class="btn btn-success" onclick="modalTurno.show()">
                + Nuevo Turno
            </button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="card-title mb-0">Listado de turnos</h5>
                    <span class="badge bg-primary fs-6" id="total_turnos">Total: 0</span>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Fecha y Hora</th>
                                <th>Mascota (Dueño)</th>
                                <th>Veterinario</th>
                                <th>Motivo</th>
                                <th class="text-end">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="listar_turnos">
                        </tbody>
                    </table>
                </div>

                <div id="mensajeVacioTurnos" class="text-center text-muted py-5 d-none">
                    <p class="mb-0">No hay turnos registrados todavía.</p>
                </div>
            </div>
        </div>

        <!-- MODAL para agregar Turno -->
        <div class="modal fade" id="modal-turno" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">Nuevo Turno</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    
                    <form id="form-agregar-turno" class="d-flex flex-column gap-3 p-4 bg-body-tertiary rounded-4">
                        <div>
                            <label for="fechaHora" class="form-label">Fecha y Hora *</label>
                            <input type="datetime-local" name="fechaHora" id="fechaHora" class="form-control" required>
                        </div>

                        <div>
                            <label for="mascotaSelect" class="form-label">Mascota *</label>
                            <select name="mascotaSelect" id="mascotaSelect" class="form-select" required>
                                <option value="" disabled selected>Seleccione una mascota</option>
                            </select>
                        </div>

                        <div>
                            <label for="veterinarioSelect" class="form-label">Veterinario *</label>
                            <select name="veterinarioSelect" id="veterinarioSelect" class="form-select" required>
                                <option value="" disabled selected>Seleccione un veterinario</option>
                            </select>
                        </div>

                        <div>
                            <label for="motivo" class="form-label">Motivo de consulta *</label>
                            <input type="text" name="motivo" id="motivo" class="form-control" placeholder="Ej: Vacunación anual, Control" required>
                        </div>

                        <button class="btn btn-primary" type="submit">Guardar Turno</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="contenedor_footer">
    </footer>

    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
